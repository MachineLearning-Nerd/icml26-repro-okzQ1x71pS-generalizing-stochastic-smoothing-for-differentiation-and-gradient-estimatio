[project]
name = "gss-reproduction"
version = "0.1.0"
description = "Claim-by-claim reproduction of arXiv 2410.08125"
requires-python = ">=3.12,<3.13"
dependencies = [
  "marimo==0.23.1",
  "matplotlib==3.10.5",
  "numpy==2.3.2",
  "pandas==2.3.1",
  "scikit-image==0.25.2",
  "scipy==1.16.1",
  "torch==2.7.1+cpu",
  "torchvision==0.22.1+cpu",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repro"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
